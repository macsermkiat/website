<!doctype html>
<html><head><meta charset="utf-8"><title>People check</title>
<style>html,body{margin:0;background:#10131a;overflow:hidden}canvas{display:block}</style></head>
<body>
<script type="module">
// ?figs=people_man_coat:idle:1.2,people_woman_coat:sit:0.5&lite=1&cam=x,y,z,tx,ty,tz,fov&gap=0.9
// Plays each clip the way site/src/crowd.js does: the named clip, else idle (walk for walk*), mug mesh hidden
// for *_free clips; colours from &colors=coat|scarf|hat per figure (optional).
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import { clone as cloneSkinned } from 'three/examples/jsm/utils/SkeletonUtils.js';

const q = new URLSearchParams(location.search);
const lite = q.get('lite') === '1';
const figs = (q.get('figs') || 'people_man_coat:idle:1').split(',').map((s) => { const [n, c, t] = s.split(':'); return { n, c, t: +t || 0 }; });
const gap = +(q.get('gap') || 0.9);
const cam = (q.get('cam') || '').split(',').map(Number);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151a24);
scene.add(new THREE.HemisphereLight(0x8fa4c8, 0x2a2118, 0.9));
const key = new THREE.DirectionalLight(0xffd2a0, 2.2); key.position.set(3, 5, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -6, right: 6, top: 4, bottom: -1 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb8ff, 1.0); rim.position.set(-3, 4, -5); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x3a3632, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(cam[6] || 35, innerWidth / innerHeight, 0.05, 100);
const n = figs.length;
camera.position.set(...(cam.length >= 3 ? cam.slice(0, 3) : [0, 1.3, 2.2 + n * 0.9]));
camera.lookAt(...(cam.length >= 6 ? cam.slice(3, 6) : [0, 0.9, 0]));
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const cache = new Map();
const info = [];
for (let i = 0; i < n; i++) {
  const f = figs[i];
  const file = `/site/public/models/${f.n}${lite ? '.lite' : ''}.glb`;
  if (!cache.has(file)) cache.set(file, await loader.loadAsync(file));
  const g = cache.get(file);
  const fig = cloneSkinned(g.scene);
  fig.position.x = -(n - 1) * gap / 2 + i * gap;
  fig.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  if (/_free$/.test(f.c)) fig.traverse((o) => { if (o.isMesh && /^mug/i.test(o.name)) o.visible = false; });
  const clips = g.animations;
  const clip = clips.find((c) => c.name === f.c) || clips.find((c) => (/^walk/.test(f.c) ? /walk/i : /idle|stand|talk/i).test(c.name)) || null;
  if (clip && f.c !== 'none') {
    const mixer = new THREE.AnimationMixer(fig);
    mixer.clipAction(clip).play();
    mixer.setTime(f.t);
  }
  info.push(`${f.n}${lite ? '.lite' : ''}: ${f.c} -> ${clip ? clip.name : 'none'} (${clips.map((c) => c.name).join(' ')})`);
  scene.add(fig);
}
renderer.render(scene, camera);
window.__info = info;
window.__ready = true;
</script>
</body></html>
