# Build the Vite site in site/ and publish it to GitHub Pages (project page at /website/).
# In the repository settings, Pages must use "GitHub Actions" as its source.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The Pages base path ("/website" for this repository; "" with a custom domain) becomes Vite's base
      - id: pages
        uses: actions/configure-pages@v5
      # Release gate: set the repository variable STRICT_CONTENT to 1 (Settings > Secrets and variables >
      # Actions > Variables) and the build fails while any [[Mac: ...]] placeholder is left in content/*.md.
      - run: npm run build
        env:
          STRICT_CONTENT: ${{ vars.STRICT_CONTENT || '0' }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
