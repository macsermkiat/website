# Build the Vite site in site/ and publish it to GitHub Pages (project page at /website/).
# In the repository settings, Pages must use "GitHub Actions" as its source.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # the browser-free checks: GPU classes for the lite market, and the ballad's road map
      - run: npm run test:unit
      # The Pages base path ("/website" for this repository; "" with a custom domain) becomes Vite's base
      - id: pages
        uses: actions/configure-pages@v5
      # The content gate is on for every deploy: the build fails while content/*.md holds a note for Mac
      # ([[Mac: ...]]), a check marker (<!-- check -->, [check]) or a book page marked `review: check`. Nothing
      # unconfirmed can reach the public site; resolve the markers (or run a local preview build) to publish.
      # Repository variable (Settings > Secrets and variables > Actions > Variables):
      #   CONTENT_NOTES=show  publish the notes as marked gaps (only for a private preview; off unless set)
      # GITHUB_REPOSITORY (set by Actions) points the footer's "All credits" link at this repository.
      - run: npm run build
        env:
          STRICT_CONTENT: '1'
          CONTENT_NOTES: ${{ vars.CONTENT_NOTES || 'hide' }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      # The budget gate (scripts/budget.mjs --strict): counting every external texture, the first load of each market
      # must stay under its aim (25 MB full, 8 MB lite) and below round 4's (19.70 MB full, 7.44 MB lite), or nothing
      # is deployed. Per-asset budgets are reported for the roles that own the models.
      - name: Budget gate (first load of each market)
        run: npm run budget -- --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
